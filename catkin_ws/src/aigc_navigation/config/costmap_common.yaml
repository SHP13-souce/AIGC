# Common costmap parameters, loaded into BOTH the global and local costmaps.
#
# NOTE: observation_sources and its scan config must live under
# obstacle_layer, and inflation settings under inflation_layer, so that the
# costmap_2d plugins read them from their own namespaces, e.g.
#   /move_base/global_costmap/obstacle_layer/observation_sources
#   /move_base/local_costmap/obstacle_layer/observation_sources

footprint: [[-0.16, -0.11], [-0.16, 0.11], [0.17, 0.11], [0.17, -0.11]]
footprint_padding: 0.01
transform_tolerance: 0.5

obstacle_layer:
  enabled: true
  obstacle_range: 2.5
  raytrace_range: 3.0
  observation_sources: scan
  scan:
    data_type: LaserScan
    topic: /scan
    sensor_frame: laser_link
    marking: true
    clearing: true
    max_obstacle_height: 0.35
    min_obstacle_height: 0.02
    inf_is_valid: true

inflation_layer:
  enabled: true
  inflation_radius: 0.30
  cost_scaling_factor: 3.0
