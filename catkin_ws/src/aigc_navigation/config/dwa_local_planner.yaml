# DWA local planner parameters (DWAPlannerROS, differential drive, no lateral
# velocity). Conservative initial speeds for the small test arena.

DWAPlannerROS:
  # Velocity limits (m/s, rad/s)
  max_vel_x: 0.15
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.15
  min_vel_trans: 0.0
  max_vel_theta: 0.6
  min_vel_theta: -0.6
  min_in_place_vel_theta: 0.3

  # Acceleration limits
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 1.0

  # Goal tolerance
  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 0.15
  latch_xy_goal_tolerance: false

  # Forward simulation
  sim_time: 1.7
  sim_granularity: 0.025
  vx_samples: 20
  vy_samples: 0
  vth_samples: 40
  controller_frequency: 5.0

  # Scoring
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.10
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  # Oscillation handling
  oscillation_reset_dist: 0.05
