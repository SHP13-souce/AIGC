# ROUTE EXAMPLE ONLY. Same coordinates as test.world, not the competition map.
# Replace x/y/yaw and add transit waypoints around the actual field partitions.
# Order follows the supplied PDF p10: template -> math AR -> fruit AR -> finish.
frame_id: map
ready_timeout: 30.0
server_timeout: 10.0
goal_timeout: 60.0
cancel_timeout: 3.0
max_retries: 1
failure_policy: stop
dwell_time: 0.5
execute_tasks: true
waypoints:
  - {name: task_1, kind: task, target_source: object, x: 1.2, y: 0.0, yaw: 1.57079632679}
  - {name: task_2, kind: task, target_source: math, x: 1.2, y: 1.0, yaw: 3.14159265359}
  - {name: task_3, kind: task, target_source: fruit, x: -1.0, y: 1.0, yaw: -1.57079632679}
  - {name: finish, kind: finish, x: -1.0, y: -1.0, yaw: 0.0}
